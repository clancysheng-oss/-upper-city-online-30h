<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upper City 30H — Party</title>
<style>
:root{--bg:#0b0908;--card:#181410;--gold:#c9a66b;--ink:#eee4d2;--muted:#9c9388;--line:#493a2b;--green:#416447}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2b2118,#0b0908 46%);color:var(--ink);font-family:Georgia,serif}main{max-width:980px;margin:auto;padding:16px}h1,h2,h3{color:var(--gold)}.hero{text-align:center;padding:22px}.card{background:#181410ee;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 10px 28px #0008}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}input,select,textarea,button{width:100%;font:inherit;color:var(--ink);background:#100e0c;border:1px solid #59462f;border-radius:9px;padding:11px;margin:4px 0}button{background:#604529;cursor:pointer}.green{background:var(--green)}.muted{color:var(--muted);font-size:13px}.member{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30271f;padding:10px 2px}.ready{color:#9ec3a5}.wait{color:#d5a177}.pill{display:inline-block;border:1px solid #59462f;border-radius:20px;padding:6px 9px;margin:3px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.log{height:270px;overflow:auto;background:#090807;padding:10px;border-radius:9px}.msg{padding:6px;border-bottom:1px solid #29221b}.choice{text-align:left}.danger{background:#6c302b}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{display:block}.row>*{width:100%}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main>
<div class="hero"><div class="muted">BALDUR'S GATE · MULTIPLAYER D&D</div><h1>THE UPPER CITY</h1><div>30H PARTY CAMPAIGN</div></div>

<section id="home" class="card"><h2>开始</h2><input id="pname" placeholder="角色名"><select id="pclass"><option>战士</option><option>游荡者</option><option>法师</option><option>牧师</option><option>圣武士</option><option>吟游诗人</option><option>术士</option><option>游侠</option></select><div class="row"><button id="create">创建队伍</button><button id="joinShow">加入队伍</button></div><button id="cfgShow">连接设置</button><div id="homeStatus" class="muted"></div></section>

<section id="joinPanel" class="card hidden"><h2>加入队伍</h2><input id="invite" placeholder="5位邀请码，例如 AB7K2"><button id="join">加入</button><button class="back">返回</button></section>
<section id="cfg" class="card hidden"><h2>Supabase 设置</h2><input id="url" placeholder="Project URL"><input id="key" placeholder="anon/public key"><button id="saveCfg">保存</button><button class="back">返回</button></section>

<section id="lobby" class="hidden">
<div class="card"><h2>组队大厅</h2><p>队伍：<b id="partyCode"></b>　<span id="count"></span></p><div id="members"></div>
<div class="row"><button id="ready" class="green">准备</button><button id="copyInvite">复制邀请链接</button></div><button id="start" class="hidden">👑 开始冒险</button><p id="lobbyStatus" class="muted"></p></div>
</section>

<section id="game" class="hidden"><div class="grid"><div>
<div class="card"><h2 id="chapter"></h2><h3 id="sceneTitle"></h3><p id="story"></p><div id="choices"></div></div>
<div class="card"><h3>自由行动</h3><textarea id="action" placeholder="描述你的行动、对白或计划……"></textarea><div class="row"><button id="send">发送行动</button><button id="roll">D20</button></div><button id="next" class="hidden">👑 DM / 房主推进</button></div>
<div class="card"><h3>队伍记录</h3><div id="log" class="log"></div></div></div>
<div><div class="card"><h3>队伍</h3><div id="gameMembers"></div></div><div class="card"><h3>任务 / 线索</h3><div id="quest"></div><div id="clues"></div></div><div class="card"><h3>战斗</h3><div id="combat">当前没有战斗。</div><button id="attack">攻击</button></div></div></div></section>

<script>
const $=x=>document.getElementById(x);let sb,me,myClass,code,isHost=false,state,chan;
const scenes=[
["序章：金门之后","血色马车","暴雨敲打白石城门。一辆无家徽黑色马车疾驰而过，车底滴落暗红液体。守卫正朝你们走来。","调查黑色马车。",["检查血迹","询问守卫","跟踪马车","查看登记册"]],
["第一幕：失踪的纹章","埃文伍德宅邸","年轻贵族 Lucan 在晚宴前夜失踪。墙上家族纹章被完整切走，窗台残留银灰粉末。","调查 Lucan 的失踪。",["检查银灰粉末","审问仆人","搜查书房","调查脚印"]],
["第一幕：三家之争","贵族棋局","三个敌对家族都在秘密寻找一份旧城契约。你们必须决定从谁开始。","选择调查方向。",["拜访改革派","潜入旧贵族","接触地下线人","保持中立"]],
["第二幕：午夜拍卖会","无灯市场","午夜地下拍卖会出现 Lucan 的匕首和半张上城区秘密通道图。","取得残图。",["伪装买家","后台潜入","贿赂门卫","制造骚乱"]],
["第二幕：无声钟楼","第十三声钟","废弃二十年的钟楼在凌晨三点响起第十三声，墙后暗门仅开启一分钟。","进入钟楼密室。",["破解机关","强行破门","寻找守钟人","等待钟响"]],
["第二幕：白鸦档案","被抹去的审判","秘密档案证明二十七年前发生过大规模驱逐，土地随后落入今日贵族手中。最后一页被撕走。","寻找缺失页。",["复制档案","寻找缺失页","隐瞒发现","寻找受害者后代"]],
["第三幕：下水道王庭","无冠者","被驱逐者后代掌握缺失档案，但要求队伍先解决猎杀地下居民的腐化怪物。","取得无冠者信任。",["接受任务","谈判交换","调查怪物","拒绝合作"]],
["第三幕：黑水之战","腐化巢穴","炼金废料扭曲的巨兽堵住旧隧道，甲壳刻着贵族炼金工坊编号。","击败腐化穴兽。",["进入战斗"]],
["第三幕：镜厅之夜","面具与刺客","化装舞会熄灯十秒。灯亮时一名议员倒地，凶器却握在你们盟友手中。","找出真正刺客。",["检查尸体","保护盟友","封锁出口","追查纸条"]],
["第四幕：破碎议会","公开审判","贵族、改革派、无冠者与市民都要求你们决定如何使用证据。","决定证据命运。",["公开证据","支持改革派","与旧贵族谈判","交给无冠者"]],
["第四幕：围城之前","封闭城门","伪造文件宣称你们策划政变。守卫开始搜捕队伍，此前结交的盟友将决定逃生路线。","抵达上城区之心。",["秘密通道","呼叫盟友","伪装投降","正面突破"]],
["终幕：上城区之心","原始契约","建城契约证明上城区原属于一个被抹去的公民议会。所有势力同时抵达。","决定城市未来。",["恢复公民议会","支持改革派","维持旧秩序","摧毁契约"]],
["终章：黎明判决","你们留下的城市","黎明到来。幸存者、盟友和敌人依据你们一路的选择重新站队。","书写角色尾声。",["完成战役"]]];
function client(){let u=localStorage.uc_url,k=localStorage.uc_key;if(!u||!k)throw Error("请先填写连接设置");return supabase.createClient(u,k)}
function randomCode(){let a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function fresh(){return{started:false,scene:0,clues:[],combat:null,host:me}}
async function createParty(){try{me=$("pname").value.trim();myClass=$("pclass").value;if(!me)throw Error("请输入角色名");sb=client();code=randomCode();isHost=true;let r=await sb.from("rooms").insert({code,title:"Upper City 30H"});if(r.error)throw r.error;await addPlayer(true);let g=await sb.from("game_states").insert({room_code:code,state:fresh()});if(g.error)throw g.error;enterLobby()}catch(e){$("homeStatus").textContent=e.message}}
async function addPlayer(host=false){let r=await sb.from("players").upsert({room_code:code,name:me,class_name:myClass,last_seen:new Date().toISOString(),is_host:host,is_ready:false},{onConflict:"room_code,name"});if(r.error)throw r.error}
async function joinParty(){try{me=$("pname").value.trim();myClass=$("pclass").value;code=$("invite").value.trim().toUpperCase();if(!me||!code)throw Error("填写角色名和邀请码");sb=client();let r=await sb.from("rooms").select("code").eq("code",code).maybeSingle();if(!r.data)throw Error("找不到这个队伍");await addPlayer(false);enterLobby()}catch(e){alert(e.message)}}
async function enterLobby(){$("home").classList.add("hidden");$("joinPanel").classList.add("hidden");$("lobby").classList.remove("hidden");$("partyCode").textContent=code;subscribe();await refreshLobby()}
async function refreshLobby(){let p=await sb.from("players").select("*").eq("room_code",code).order("created_at");let arr=p.data||[];let mine=arr.find(x=>x.name===me);isHost=!!mine?.is_host;$("count").textContent=arr.length+"/5";$("members").innerHTML=arr.map(x=>`<div class="member"><span>${x.is_host?"👑 ":""}${x.name} · ${x.class_name}</span><span class="${x.is_ready?"ready":"wait"}">${x.is_ready?"✓ 已准备":"未准备"}</span></div>`).join("");$("start").classList.toggle("hidden",!isHost);let g=await sb.from("game_states").select("*").eq("room_code",code).single();state=g.data?.state||fresh();if(state.started)enterGame()}
async function toggleReady(){let p=await sb.from("players").select("is_ready").eq("room_code",code).eq("name",me).single();await sb.from("players").update({is_ready:!p.data.is_ready}).eq("room_code",code).eq("name",me);await refreshLobby()}
async function startGame(){let p=await sb.from("players").select("*").eq("room_code",code);if((p.data||[]).length<2)return alert("至少需要 2 名玩家");if((p.data||[]).some(x=>!x.is_ready))return alert("还有玩家没有准备");state.started=true;await saveState();await message("DM","队伍集结完毕。冒险开始。","dm");enterGame()}
async function enterGame(){$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("next").classList.toggle("hidden",!isHost);await refreshGame()}
async function refreshGame(){let g=await sb.from("game_states").select("*").eq("room_code",code).single();state=g.data.state;render();let p=await sb.from("players").select("*").eq("room_code",code);$("gameMembers").innerHTML=(p.data||[]).map(x=>`<span class="pill">${x.is_host?"👑":""}${x.name}·${x.class_name}</span>`).join("");let m=await sb.from("messages").select("*").eq("room_code",code).order("created_at").limit(150);$("log").innerHTML=(m.data||[]).map(x=>`<div class="msg"><b>${x.sender}：</b>${x.body}</div>`).join("");$("log").scrollTop=$("log").scrollHeight}
function render(){let s=scenes[Math.min(state.scene,scenes.length-1)];$("chapter").textContent=s[0];$("sceneTitle").textContent=s[1];$("story").textContent=s[2];$("quest").innerHTML="<b>"+s[3]+"</b>";$("choices").innerHTML=s[4].map(x=>`<button class="choice">${x}</button>`).join("");[...document.querySelectorAll(".choice")].forEach((b,i)=>b.onclick=()=>choose(s[4][i]));$("clues").innerHTML=(state.clues||[]).map(x=>`<span class="pill">${x}</span>`).join("")||"<p class='muted'>暂无关键线索</p>";$("combat").innerHTML=state.combat?`<b>${state.combat.name}</b><p>HP ${state.combat.hp} · AC ${state.combat.ac}</p>`:"当前没有战斗。"}
async function choose(x){await message(me,x);if(x.includes("血迹")&&!state.clues.includes("异常炼金血迹"))state.clues.push("异常炼金血迹");if(x.includes("登记册")&&!state.clues.includes("无家徽马车登记"))state.clues.push("无家徽马车登记");await saveState();await refreshGame()}
async function nextScene(){if(!isHost)return;state.scene=Math.min(state.scene+1,scenes.length-1);if(state.scene===7)state.combat={name:"腐化穴兽",hp:42,ac:13};await saveState();await message("DM","剧情推进："+scenes[state.scene][0]+" — "+scenes[state.scene][1],"dm");await refreshGame()}
async function send(){let t=$("action").value.trim();if(!t)return;$("action").value="";await message(me,t);await refreshGame()}
async function roll(){let r=Math.floor(Math.random()*20)+1;await message(me,"D20 → "+r);await refreshGame()}
async function attack(){if(!state.combat)return alert("当前没有战斗");let r=Math.floor(Math.random()*20)+1,d=r>=state.combat.ac?Math.floor(Math.random()*8)+3:0;state.combat.hp=Math.max(0,state.combat.hp-d);await saveState();await message(me,`攻击检定 ${r}，${d?"造成 "+d+" 伤害":"未命中"}`);if(state.combat.hp<=0){await message("DM",state.combat.name+" 被击败。","dm");state.combat=null;await saveState()}await refreshGame()}
async function message(sender,body,kind="action"){await sb.from("messages").insert({room_code:code,sender,body,kind})}
async function saveState(){await sb.from("game_states").update({state,updated_at:new Date().toISOString()}).eq("room_code",code)}
function subscribe(){if(chan)sb.removeChannel(chan);chan=sb.channel("party-"+code).on("postgres_changes",{event:"*",schema:"public",table:"players",filter:"room_code=eq."+code},()=>refreshLobby()).on("postgres_changes",{event:"*",schema:"public",table:"game_states",filter:"room_code=eq."+code},()=>state?.started?refreshGame():refreshLobby()).on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"room_code=eq."+code},()=>state?.started&&refreshGame()).subscribe()}
$("create").onclick=createParty;$("joinShow").onclick=()=>{$("home").classList.add("hidden");$("joinPanel").classList.remove("hidden")};$("cfgShow").onclick=()=>{$("home").classList.add("hidden");$("cfg").classList.remove("hidden");$("url").value=localStorage.uc_url||"";$("key").value=localStorage.uc_key||""};document.querySelectorAll(".back").forEach(x=>x.onclick=()=>{$("cfg").classList.add("hidden");$("joinPanel").classList.add("hidden");$("home").classList.remove("hidden")});$("saveCfg").onclick=()=>{localStorage.uc_url=$("url").value.trim();localStorage.uc_key=$("key").value.trim();alert("已保存")};$("join").onclick=joinParty;$("ready").onclick=toggleReady;$("start").onclick=startGame;$("copyInvite").onclick=async()=>{let link=location.origin+location.pathname+"?party="+code;try{await navigator.clipboard.writeText(link);alert("邀请链接已复制")}catch{prompt("复制这个邀请链接",link)}};$("next").onclick=nextScene;$("send").onclick=send;$("roll").onclick=roll;$("attack").onclick=attack;
let qp=new URLSearchParams(location.search).get("party");if(qp){$("invite").value=qp.toUpperCase();$("home").classList.add("hidden");$("joinPanel").classList.remove("hidden")}
</script></main></body></html>
