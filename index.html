<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upper City — 30H Online D&D</title>

<style>
:root{
  --bg:#0d0c0b;
  --card:#171411;
  --gold:#c9a66b;
  --ink:#eee4d2;
  --muted:#9d9488;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#282018,#0d0c0b 48%);
  color:var(--ink);
  font-family:Georgia,serif;
}

main{
  max-width:980px;
  margin:auto;
  padding:20px;
}

.hero{
  text-align:center;
  padding:35px 10px;
}

.hero h1{
  font-size:42px;
  margin:0;
  color:var(--gold);
}

.card{
  background:#171411e8;
  border:1px solid #3c3126;
  border-radius:14px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 12px 30px #0007;
}

input,button,select,textarea{
  font:inherit;
  border-radius:9px;
  border:1px solid #4b3d30;
  padding:12px;
  background:#100e0c;
  color:var(--ink);
}

button{
  background:#5d4227;
  border-color:#8b6942;
  cursor:pointer;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row>*{flex:1}

.hidden{display:none!important}

.muted{
  color:var(--muted);
  font-size:14px;
}

.log{
  height:330px;
  overflow:auto;
  background:#0b0a09;
  padding:12px;
  border-radius:10px;
}

.msg{
  border-bottom:1px solid #29231d;
  padding:8px 2px;
}

.dm{color:#e0bd7c}
.chapter{color:#c9a66b}

#players{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  padding:7px 10px;
  border:1px solid #51402f;
  border-radius:20px;
}

textarea{
  width:100%;
  min-height:70px;
}

#status{
  margin-top:10px;
  color:#e0bd7c;
}

@media(max-width:600px){
  .hero h1{font-size:30px}
  .row{display:block}
  .row>*{
    width:100%;
    margin:4px 0;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<main>

<section class="hero">
  <div class="muted">BALDUR'S GATE • FAN-MADE TABLETOP CAMPAIGN</div>
  <h1>THE UPPER CITY</h1>
  <p>约 30 小时多人 D&D 战役</p>
</section>

<section id="setup" class="card">
  <h2>连接 Supabase</h2>

  <p class="muted">
    填写 Project URL 与 anon/public key。
  </p>

  <div class="row">
    <input id="url" placeholder="https://xxxxx.supabase.co">
    <input id="key" placeholder="anon / public key">
  </div>

  <div class="row">
    <button id="saveBtn">保存连接</button>
    <button id="clearBtn">清除</button>
  </div>
</section>

<section id="lobby" class="card">

  <h2>进入战役</h2>

  <div class="row">
    <input id="name" placeholder="角色名">

    <select id="klass">
      <option>战士</option>
      <option>游荡者</option>
      <option>法师</option>
      <option>牧师</option>
      <option>圣武士</option>
      <option>吟游诗人</option>
      <option>术士</option>
      <option>游侠</option>
    </select>
  </div>

  <div class="row">
    <input id="room" placeholder="房间码（例如 GATE7）">
    <button id="joinBtn">加入 / 创建房间</button>
  </div>

  <div id="status"></div>

</section>

<section id="game" class="hidden">

  <div class="card">
    <div class="row">
      <div>
        <b>房间：</b>
        <span id="roomLabel"></span>
      </div>

      <div>
        <b>章节：</b>
        <span id="chapterLabel"></span>
      </div>
    </div>

    <div id="players"></div>
  </div>

  <div class="card">

    <h2>DM 场景</h2>

    <div id="scene"></div>

    <div class="row">
      <button id="nextBtn">推进场景</button>
      <button id="d20Btn">D20</button>
      <button id="d100Btn">D100</button>
    </div>

  </div>

  <div class="card">

    <h2>队伍频道</h2>

    <div id="log" class="log"></div>

    <textarea
      id="message"
      placeholder="描述你的行动、对白或计划……">
    </textarea>

    <div class="row">
      <button id="sendBtn">发送行动</button>
      <button id="dmBtn">DM 提示</button>
    </div>

  </div>

</section>

<script>

let sb=null;
let roomId="";
let me="";
let sceneIndex=0;

const campaign=[
["序章：金门之后",
"你们穿过通往上城区的巨大拱门。雨水沿着白石雕像流下，守卫正在逐一核验通行证。一辆没有家徽的黑色马车从贵族车道疾驰而过，车底滴落着暗红色液体。"],

["第一章：失踪的纹章",
"一名年轻贵族在宴会前夜失踪。他的房间没有搏斗痕迹，唯独家族纹章被人从墙上完整切走。"],

["第二章：午夜拍卖会",
"线索指向只在午夜开放的地下拍卖场。拍品中出现了一把属于失踪者的匕首。"],

["第三章：无声钟楼",
"城中的旧钟楼已经二十年没有敲响，但附近居民声称凌晨三点会听见第十三声钟响。"],

["第四章：三家的晚宴",
"三大贵族家族同时邀请队伍赴宴，而缺席本身也会成为一种政治表态。"],

["第五章：白鸦档案",
"一座私人档案馆保存着几十年前被抹去的审判记录。"],

["第六章：下水道王庭",
"地面上的阴谋延伸至城市地下。"],

["第七章：镜厅之夜",
"年度化装舞会开始。刺客就在宾客之间。"],

["第八章：破碎议会",
"证据公开后，议会分裂。"],

["第九章：围城之前",
"城市大门突然封闭。"],

["第十章：上城区之心",
"所有线索最终汇聚到城市最古老建筑的地下。"],

["终章：黎明判决",
"没有唯一正确结局。上城区的未来将由玩家此前的选择决定。"]
];

const $=id=>document.getElementById(id);

function setStatus(text){
  $("status").textContent=text;
}

function loadConfig(){
  $("url").value=localStorage.getItem("uc_url")||"";
  $("key").value=localStorage.getItem("uc_key")||"";
}

function saveConfig(){

  const u=$("url").value.trim();
  const k=$("key").value.trim();

  if(!u||!k){
    alert("请先填写 Supabase URL 和 anon/public key");
    return;
  }

  localStorage.setItem("uc_url",u);
  localStorage.setItem("uc_key",k);

  alert("连接信息已保存");
}

function clearConfig(){

  localStorage.removeItem("uc_url");
  localStorage.removeItem("uc_key");

  $("url").value="";
  $("key").value="";

  setStatus("");
}

async function join(){

  setStatus("正在连接 Supabase……");

  try{

    const u=
      localStorage.getItem("uc_url")||
      $("url").value.trim();

    const k=
      localStorage.getItem("uc_key")||
      $("key").value.trim();

    const playerName=$("name").value.trim();

    const roomCode=
      $("room").value.trim().toUpperCase();

    const className=$("klass").value;

    if(!u||!k){
      throw new Error("没有 Supabase 连接信息");
    }

    if(!playerName){
      throw new Error("请输入角色名");
    }

    if(!roomCode){
      throw new Error("请输入房间码");
    }

    if(!window.supabase){
      throw new Error("Supabase JS 没有加载成功");
    }

    sb=window.supabase.createClient(u,k);

    roomId=roomCode;
    me=playerName;

    setStatus("正在创建房间……");

    const roomResult=
      await sb
      .from("rooms")
      .upsert(
        {
          code:roomId,
          title:"Upper City 30H"
        },
        {
          onConflict:"code"
        }
      );

    if(roomResult.error){
      throw new Error(
        "rooms：" + roomResult.error.message
      );
    }

    setStatus("正在加入玩家……");

    const playerResult=
      await sb
      .from("players")
      .upsert(
        {
          room_code:roomId,
          name:me,
          class_name:className,
          last_seen:new Date().toISOString()
        },
        {
          onConflict:"room_code,name"
        }
      );

    if(playerResult.error){
      throw new Error(
        "players：" + playerResult.error.message
      );
    }

    $("setup").classList.add("hidden");
    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");

    $("roomLabel").textContent=roomId;

    renderScene();

    await refresh();

    subscribe();

    await system(me+" 进入了上城区。");

  }catch(error){

    console.error(error);

    setStatus(
      "连接失败：" +
      (error?.message||String(error))
    );

    alert(
      "连接失败：\n" +
      (error?.message||String(error))
    );
  }
}

function renderScene(){

  const s=
    campaign[
      Math.min(
        sceneIndex,
        campaign.length-1
      )
    ];

  $("chapterLabel").textContent=s[0];

  $("scene").innerHTML=
    "<h3 class='chapter'>"+
    esc(s[0])+
    "</h3><p>"+
    esc(s[1])+
    "</p>";
}

async function nextScene(){

  sceneIndex=
    Math.min(
      sceneIndex+1,
      campaign.length-1
    );

  renderScene();

  await system(
    "DM 推进至："+campaign[sceneIndex][0]
  );
}

async function system(text){

  if(!sb)return;

  const result=
    await sb
    .from("messages")
    .insert({
      room_code:roomId,
      sender:"DM",
      body:text,
      kind:"dm"
    });

  if(result.error){
    console.error(result.error);
  }
}

async function sendMsg(){

  const text=
    $("message").value.trim();

  if(!text)return;

  $("message").value="";

  const result=
    await sb
    .from("messages")
    .insert({
      room_code:roomId,
      sender:me,
      body:text,
      kind:"action"
    });

  if(result.error){
    alert(
      "发送失败："+result.error.message
    );
  }
}

async function roll(n){

  const r=
    Math.floor(Math.random()*n)+1;

  const result=
    await sb
    .from("messages")
    .insert({
      room_code:roomId,
      sender:me,
      body:"掷 D"+n+" → "+r,
      kind:"roll"
    });

  if(result.error){
    alert(
      "投骰失败："+result.error.message
    );
  }
}

async function dmPrompt(){

  await system(
    "DM：根据玩家最近的行动进行一次检定或描述后果。"
  );
}

async function refresh(){

  const pResult=
    await sb
    .from("players")
    .select("*")
    .eq("room_code",roomId)
    .order("created_at");

  if(pResult.error){
    throw new Error(
      "读取玩家失败："+pResult.error.message
    );
  }

  $("players").innerHTML=
    (pResult.data||[])
    .map(
      x=>
      "<span class='pill'>"+
      esc(x.name)+
      " · "+
      esc(x.class_name||"冒险者")+
      "</span>"
    )
    .join("");

  const mResult=
    await sb
    .from("messages")
    .select("*")
    .eq("room_code",roomId)
    .order("created_at")
    .limit(200);

  if(mResult.error){
    throw new Error(
      "读取消息失败："+mResult.error.message
    );
  }

  $("log").innerHTML=
    (mResult.data||[])
    .map(
      x=>
      "<div class='msg "+
      (x.kind==="dm"?"dm":"")+
      "'><b>"+
      esc(x.sender)+
      ":</b> "+
      esc(x.body)+
      "</div>"
    )
    .join("");

  $("log").scrollTop=
    $("log").scrollHeight;
}

function subscribe(){

  sb
  .channel("room-"+roomId)

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"messages",
      filter:"room_code=eq."+roomId
    },
    refresh
  )

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"players",
      filter:"room_code=eq."+roomId
    },
    refresh
  )

  .subscribe();
}

function esc(value){

  return String(value||"")
  .replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

/* 所有按钮在这里绑定，不再使用 onclick */

$("saveBtn").addEventListener(
  "click",
  saveConfig
);

$("clearBtn").addEventListener(
  "click",
  clearConfig
);

$("joinBtn").addEventListener(
  "click",
  join
);

$("nextBtn").addEventListener(
  "click",
  nextScene
);

$("d20Btn").addEventListener(
  "click",
  ()=>roll(20)
);

$("d100Btn").addEventListener(
  "click",
  ()=>roll(100)
);

$("sendBtn").addEventListener(
  "click",
  sendMsg
);

$("dmBtn").addEventListener(
  "click",
  dmPrompt
);

loadConfig();

</script>

</main>
</body>
</html>
